  close: () => closeSheet(),
  'set-season': el => { S.filter.season = el.dataset.v; store.set('filter', S.filter); openSheet(filterSheet()); render(); },
  'set-group': el => { S.filter.group = el.dataset.v; store.set('filter', S.filter); openSheet(filterSheet()); render(); },
  sort: el => { S.ui.sort = el.dataset.v; saveUi(); render(); },
  'deck-sort': el => { S.ui.deckSort = el.dataset.v; saveUi(); render(); },
  color: el => { const c = el.dataset.c; S.ui.colors = S.ui.colors.includes(c) ? S.ui.colors.filter(x => x !== c) : S.ui.colors.concat(c); saveUi(); render(); },
  mine: () => { S.ui.mine = !S.ui.mine; saveUi(); render(); },
  'choose-me': async el => {
    if (TOKEN()) {
      el.disabled = true;
      const out = await api('appLinkMe', { player: el.dataset.key });
      el.disabled = false;
      if (out.auth) { signOut(out.error); return; }
      if (!out.ok) { toast(out.offline ? 'No connection. Try again when you have signal.' : out.error); return; }
      applyLive(out.data.live);
    }
    S.me = el.dataset.key; store.set('me', S.me); S.gate = ''; location.hash = '#/home'; render();
  },
  browse: () => { S.gate = 'browse'; render(); },
  switch: () => { closeSheet(); S.me = ''; store.del('me'); S.gate = ''; render(); },
  reload: async () => { closeSheet(); toast('Checking…'); if (await refresh()) toast('Up to date.'); },
  signout: () => { closeSheet(); store.del('me'); S.me = ''; if (TOKEN()) CHOIR.signOut(); else signOut(''); },
  rsvp: el => {
    const status = myRsvp(el.dataset.night) === el.dataset.v ? '' : el.dataset.v;
    send('appRsvp', { me: S.me, nightId: el.dataset.night, status }, status === 'in' ? 'You’re in.' : status === 'maybe' ? 'Marked as maybe.' : status === 'out' ? 'Marked as can’t go.' : 'Answer cleared.');
  },
  'new-night': () => { if (!S.me) { toast('Pick your name first.'); return; } openSheet(nightForm(null)); },
  'edit-night': el => openSheet(nightForm(S.live.nights.find(n => n.id === el.dataset.night))),
  'cancel-night': el => { if (confirmInline(el, 'Tap again to cancel this night')) send('appCancelNight', { me: S.me, nightId: el.dataset.night }, 'Game night cancelled.'); },
  'pod-size': el => { S.ui.podSize = +el.dataset.v; saveUi(); render(); },
  pods: async el => {
    el.disabled = true; el.textContent = 'Shuffling the tables…';
    const out = await api('appMakePods', { me: S.me, nightId: el.dataset.night, podSize: S.ui.podSize || 4 });
    if (out.ok) { applyLive(out.data); toast('Pods are ready.'); } else toast(out.offline ? 'Pods need a connection. Try again in a moment.' : out.error);
    render();
  },
  story: el => openSheet(storySheet(el.dataset.game)),
  ics: el => {
    const n = S.live.nights.find(x => x.id === el.dataset.night);
    const url = URL.createObjectURL(new Blob([icsFor(n)], { type: 'text/calendar' }));
    const a = document.createElement('a'); a.href = url; a.download = 'game-night.ics'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  share: async el => {
    const n = S.live.nights.find(x => x.id === el.dataset.night);
    const url = location.href.split('#')[0].split('?')[0] + '#/night/' + n.id;
    const text = n.title + ', ' + nightWhen(n, true) + (n.place ? ' at ' + n.place : '');
    if (navigator.share) { try { await navigator.share({ title: n.title, text, url }); } catch (e) {} }
    else if (navigator.clipboard) { await navigator.clipboard.writeText(text + '\n' + url); toast('Link copied.'); }
  }
};
function saveUi() { store.set('ui', S.ui); }

function confirmInline(el, message) {
  if (el.dataset.armed) return true;
  el.dataset.armed = '1';
  const original = el.textContent;
  el.textContent = message;
  setTimeout(() => { if (el.isConnected) { el.textContent = original; delete el.dataset.armed; } }, 4000);
  return false;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.input) {
    S.ui[el.dataset.input] = el.value;
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      saveUi();
      // Redraw results without stealing the keyboard.
      const pos = el.selectionStart;
      const id = el.dataset.input;
      el.blur();
      render();
      const again = document.querySelector('[data-input="' + id + '"]');
      if (again) { again.focus({ preventScroll: true }); try { again.setSelectionRange(pos, pos); } catch (err) {} }
    }, 250);
  }
  if (el.dataset.filterList) {
    const q = el.value.toLowerCase();
    document.querySelectorAll('#' + el.dataset.filterList + ' li').forEach(li => { li.hidden = q && !li.dataset.name.includes(q); });
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(form).entries());
  const kind = form.dataset.form;
  if (kind === 'pass') {
    S.pass = String(v.pass || '').trim();
    S.gateError = '';
    const button = form.querySelector('button');
    button.disabled = true; button.textContent = 'Opening…';
    const out = await api('appData', { me: S.me });
    if (out.ok) {
      store.set('pass', S.pass);
      S.data = out.data.dataset; store.set('data', S.data); saveArt(S.data);
      S.server = out.build || ''; store.set('server', S.server);
      applyLive(out.data.live);
      S.syncedAt = Date.now(); store.set('syncedAt', S.syncedAt);
      render();
    } else {
      S.pass = '';
      S.gateError = out.offline ? 'The Grimoire could not be reached. Check your connection.' : out.error;
      render();
    }
  } else if (kind === 'night') {
    const start = new Date(v.date + 'T' + v.time);
    if (Number.isNaN(start.getTime())) { toast('Choose a date and time.'); return; }
    const existing = S.live.nights.some(n => n.id === v.id);
    closeSheet();
    send('appSaveNight', { me: S.me, night: { id: v.id, startsAt: start.toISOString(), title: v.title, place: v.place, host: v.host, seats: +v.seats || 8, notes: v.notes } },
      existing ? 'Changes saved.' : 'Game night scheduled. Discord has been told.');
    location.hash = '#/night/' + v.id;
  } else if (kind === 'story') {
    if (!String(v.summary || v.moment || v.mvp).trim()) { toast('Write a line about the battle first.'); return; }
    closeSheet();
    send('appSaveStory', { me: S.me, gameId: v.gameId, summary: v.summary, mvp: v.mvp, moment: v.moment }, 'Story saved.');
  }
});

/* ---------------- Start ---------------- */
if ('serviceWorker' in navigator && !DEMO && location.protocol === 'https:') {
  navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
}
render();
if (authed()) { refresh(true).then(() => flush()); }
setInterval(() => { if (document.visibilityState === 'visible' && authed()) refresh(true); }, 5 * 60000);
if (window.CHOIR && CHOIR.backdrop && !DEMO) CHOIR.backdrop(document.getElementById('root'), '.tabs');
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && authed() && Date.now() - S.syncedAt > 60000) refresh(true); });
</script>
</body>
</html>
